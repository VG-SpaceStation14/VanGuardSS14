name: Update Changelog

on:
  push:
    branches: [ master, staging, stable ]
    paths:
      - 'Resources/Changelog/**.yml'
  workflow_dispatch:
    inputs:
      send_discord:
        description: 'Send new entries to Discord'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Build ChangelogVanGuard.yml
        run: python Tools/update_changelog.py Resources/Changelog/ChangelogVanGuard.yml Resources/Changelog/

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update ChangelogVanGuard.yml"
          file_pattern: "Resources/Changelog/*.yml"

      - name: Send to Discord
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.send_discord)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.CHANGELOG_DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Discord webhook not set, skipping."
            exit 0
          fi
          python Tools/actions_changelogs_since_last_run.py