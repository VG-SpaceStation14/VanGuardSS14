- type: entity
  parent: BaseBankIDCard
  id: IAAIDCard
  name: internal affairs agent ID card
  components:
  - type: Sprite
    layers:
    - state: silver
    # VG-Tweak - stripe_top commented
    # - state: stripe_top
    #   color: "#1b67a5"
    # VG-Tweak - stripe_bottom commented
    # - state: stripe_bottom
    #   color: "#0e4069"
    - sprite: &icon-rsi Corvax/Interface/Misc/job_icons.rsi
      offset: &icon-offset -0.17475, 0.02025 # VG-Tweak
      state: IAA
  - type: PresetIdCard
    job: IAA

