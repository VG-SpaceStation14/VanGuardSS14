- type: entity
  parent: BasePDA
  id: IAAPDA
  name: internal affairs agent PDA
  description: Corporation and profit are best friends.
  components:
  # VG-Tweak Start
  - type: Sprite
    layers:
    - map: [ "enum.PdaVisualLayers.Base" ]
      state: pda_base
      color: "#6f6192"
    - state: pda_buttons
    - map: [ "enum.PdaVisualLayers.Screen" ]
      state: pda_screen_borders
    - state: light_overlay
      map: [ "enum.PdaVisualLayers.Flashlight" ]
      shader: unshaded
      visible: false
    - state: id_overlay
      map: [ "enum.PdaVisualLayers.IdLight" ]
      shader: unshaded
      visible: false
    - state: "insert_overlay"
      map: [ "enum.PdaVisualLayers.Pen" ]
  # VG-Tweak End
  - type: Pda
    id: IAAIDCard
    penSlot:
      startingItem: PenLegal
  # VG-Tweak Start
  - type: PdaBorderColor
    borderColor: "#6f6192"
  # VG-Tweak End

- type: entity
  parent: BaseSecurityPDA
  id: PilotPDA
  name: pilot PDA
  description: Has protection from cosmic radiation.
  components:
  # VG-Tweak Start
  - type: Sprite
    layers:
    - map: [ "enum.PdaVisualLayers.Base" ]
      state: pda_base
      color: "#A32D26"
    - state: pda_buttons
    - state: pda_stripe_thick
      color: "#DFDFDF"
    - map: [ "enum.PdaVisualLayers.Screen" ]
      state: pda_screen_borders
    - state: light_overlay
      map: [ "enum.PdaVisualLayers.Flashlight" ]
      shader: unshaded
      visible: false
    - state: id_overlay
      map: [ "enum.PdaVisualLayers.IdLight" ]
      shader: unshaded
      visible: false
    - state: "insert_overlay"
      map: [ "enum.PdaVisualLayers.Pen" ]
  - type: PdaBorderColor
    borderColor: "#A32D26"
    accentVColor: "#DFDFDF"
  # VG-Tweak End
  - type: Pda
    id: PilotIDCard
  - type: EntityTableContainerFill
    containers:
      preinstalled-program-container: !type:AllSelector
        children:
        - id: CrewManifestCartridge
        - id: NotekeeperCartridge
        - id: NanoTaskCartridge
        - id: NewsReaderCartridge
        - id: WantedListCartridge
        - id: AstroNavCartridge

