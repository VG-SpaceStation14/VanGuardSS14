- type: job
  id: SeniorOfficer
  name: job-name-senior-officer
  description: job-description-senior-officer
  playTimeTracker: JobSeniorOfficer
  # VG-Tweak Start: economy salary rebalance.
  salary: 500
  # VG-Tweak End
  requirements:
    - !type:RoleTimeRequirement
      role: JobWarden
      time: 6h
    - !type:RoleTimeRequirement
      role: JobDetective
      time: 2h
    - !type:RoleTimeRequirement
      role: JobSecurityOfficer
      time: 6h
    - !type:DepartmentTimeRequirement
      department: Security
      time: 60h
  startingGear: SeniorOfficerGear
  icon: "JobIconSeniorOfficer"
  supervisors: job-supervisors-hos
  access:
  - Security
  - Brig
  - Maintenance
  - Service
  - External
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]

- type: startingGear
  id: SeniorOfficerGear
  equipment:
    shoes: ClothingShoesBootsCombatFilled
    eyes: ClothingEyesGlassesSecurity
    # VG-Tweak Start: the PDA is handed out by the SeniorOfficerID loadout group so pen choices can replace the pen.
    # id: SeniorOfficerPDA
    # VG-Tweak End
    ears: ClothingHeadsetSecurity
    pocket1: WeaponPistolMk58
  storage:
    back:
    - Flash
    - MagazinePistol

- type: chameleonOutfit
  id: SeniorOfficerChameleonOutfit
  job: SeniorOfficer
  hasMindShield: true
  equipment:
    head: ClothingHeadHatBeretSecurity
    eyes: ClothingEyesGlassesSecurity
    mask: ClothingMaskGasSecurity
    gloves: ClothingHandsGlovesColorBlack
