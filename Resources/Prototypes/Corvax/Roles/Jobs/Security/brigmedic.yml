- type: job
  id: Brigmedic
  name: job-name-brigmedic
  description: job-description-brigmedic
  playTimeTracker: JobBrigmedic
  # VG-Tweak Start: economy salary rebalance.
  salary: 420
  # VG-Tweak End
  requirements:
  - !type:DepartmentTimeRequirement
    department: Medical
    time: 15h
  - !type:DepartmentTimeRequirement
    department: Security
    time: 5h
  - !type:TraitsRequirement
    inverted: true
    traits:
    - Muted
  startingGear: BrigmedicGear
  icon: "JobIconBrigmedic"
  supervisors: job-supervisors-cmo
  access:
  - Security
  - Brig
  - Maintenance
  - Medical
  # VG-Tweak Start: the brigmedic responds to emergencies outside the brig as well (old build behaviour).
  - External
  # VG-Tweak End
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]

- type: startingGear
  id: BrigmedicGear
  equipment:
    eyes: ClothingEyesHudMedical
    # VG-Tweak Start: the PDA is handed out by the BrigmedicID loadout group so RP variations can replace it.
    # id: BrigmedicPDA
    # VG-Tweak End
    ears: ClothingHeadsetBrigmedic
    belt: ClothingBeltMedicalFilled
  storage:
    back:
    - Flash

- type: chameleonOutfit
  id: BrigmedicChameleonOutfit
  job: Brigmedic
  hasMindShield: true
  equipment:
    head: ClothingHeadHatBeretSecurityMedic
    eyes: ClothingEyesHudMedSec
    mask: ClothingMaskBreathMedicalSecurity
    outerClothing: ClothingUniformJumpsuitBrigmedic #верхняя одежда
    neck: ClothingNeckScarfStripedRed #шея
    gloves: ClothingHandsGlovesLatex # перчи
