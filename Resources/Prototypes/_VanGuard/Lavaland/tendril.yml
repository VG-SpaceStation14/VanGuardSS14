- type: entity
  parent: BaseStructure
  id: LavalandTendril
  description: A pulsing growth rooted in the planet's crust.
  components:
  - type: Sprite
    sprite: _VanGuard/Structures/Specific/tendril.rsi
    state: tendril
    drawdepth: Mobs
  - type: LavalandTendril
  - type: LavalandAshStormImmune
  - type: Injurable
    damageContainer: Biological
  - type: Damageable
    damageModifierSet: Skeleton
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.45,0.25,0.45"
        mask:
        - MobMask
        layer:
        - MobLayer
        density: 200

- type: entity
  parent: CrateGenericSteel
  id: LavalandNecropolisCrate
  components:
  - type: Sprite
    sprite: _VanGuard/Structures/Storage/Crates/necropolis.rsi
    layers:
    - state: base
    - state: closed
      map: [ "enum.StorageVisualLayers.Door" ]
  - type: Icon
    sprite: _VanGuard/Structures/Storage/Crates/necropolis.rsi
    state: icon
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: SteelOre
          amount: 3
        - !type:GroupSelector
          children:
          - id: GoldOre
            weight: 0.35
          - id: SilverOre
            weight: 0.30
          - id: PlasmaOre
            weight: 0.20
          - id: UraniumOre
            weight: 0.10
          - id: DiamondOre
            weight: 0.05
        - !type:GroupSelector
          children:
          - id: SurvivalKnife
            weight: 0.35
          - id: MineralScanner
            weight: 0.25
          - id: OreBag
            weight: 0.20
          - id: FlashlightSeclite
            weight: 0.15
          - id: WeaponProtoKineticAccelerator
            weight: 0.05

