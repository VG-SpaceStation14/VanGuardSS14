- type: entity
  parent: BaseMobAsteroid
  id: LavalandMobLegion
  name: legion
  description: A truly alien creature, a mass of unknown organic material that splits off pieces of itself to attack.
  components:
  - type: Sprite
    sprite: _VanGuard/Mobs/Aliens/Lavaland/legion.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: legion
  - type: DamageStateVisuals
    states:
      Alive:
        Base: legion
      Dead:
        Base: legion
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 4.0
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 0
  - type: Gun
    fireRate: 0.3
    selectedMode: SemiAuto
    showExamineText: false
    availableModes:
    - SemiAuto
    soundGunshot: null
  - type: RechargeBasicEntityAmmo
    showExamineText: false
    rechargeCooldown: 0
    rechargeSound: null
  - type: BasicEntityAmmoProvider
    proto: LavalandMobLegionSkull
    capacity: 1
    count: 1
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleRangedHostileCompound
    blackboard:
      VisionRadius: !type:Single
        4
      AggroVisionRadius: !type:Single
        9
      NavSmash: !type:Bool
        true
  - type: LavalandAshStormImmune
  - type: ToolRefinable
    refineResult:
    - id: FoodHivelordRemains
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        offset: 0
        spawn:
          RandomCargoCorpseSpawner:
            min: 1
            max: 1
      - !type:SpawnEntitiesBehavior
        offset: 0
        spawn:
          LavalandLegionCore:
            min: 1
            max: 1

- type: entity
  parent: BaseMobAsteroid
  id: LavalandMobLegionSkull
  name: legion skull
  description: A fragment of a legion, still hostile and still moving.
  components:
  - type: Sprite
    sprite: _VanGuard/Mobs/Aliens/Lavaland/legion.rsi
    layers:
    - state: legion_skull
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 4.0
  - type: MobThresholds
    thresholds:
      0: Alive
      10: Dead
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    angle: 0
    attackRate: 1.0
    range: 0.75
    animation: WeaponArcPunch
    damage:
      types:
        Slash: 7
  - type: Ammo
    muzzleFlash: null
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      VisionRadius: !type:Single
        15
      AggroVisionRadius: !type:Single
        15
  - type: TimedDespawn
    lifetime: 30
  - type: LavalandAshStormImmune

- type: entity
  parent: MarkerBase
  id: LavalandSpawnMobLegion
  name: legion spawner
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: green
    - state: ai
  - type: RandomSpawner
    prototypes:
    - LavalandMobLegion
    deleteSpawnerAfterSpawn: true
