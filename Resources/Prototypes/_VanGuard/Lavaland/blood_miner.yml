- type: damageContainer
  id: LavalandBloodMiner
  supportedGroups:
  - Brute
  - Toxin
  - Genetic

- type: entity
  abstract: true
  parent: BaseMobAsteroid
  id: LavalandMobBloodMinerBase
  components:
  - type: Injurable
    damageContainer: LavalandBloodMiner
  - type: Damageable
  - type: MobThresholds
    thresholds:
      0: Alive
      2500: Dead
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: GoliathCompound
    blackboard:
      VisionRadius: !type:Single
        30
      AggroVisionRadius: !type:Single
        16
      NavSmash: !type:Bool
        true
  - type: NPCUseActionOnTarget
    actionId: ActionBloodMinerShoot
  - type: LavalandAshStormImmune
  - type: NoSlip
  - type: ExplosionResistance
    damageCoefficient: 0
  - type: Tag
    tags:
    - CannotSuicide
    - DoorBumpOpener

- type: entity
  parent: LavalandMobBloodMinerBase
  id: LavalandMobBloodMiner
  name: blood miner
  description: A hulking miner driven mad by the depths of Lavaland.
  components:
  - type: Sprite
    sprite: _VanGuard/Mobs/Aliens/Lavaland/bloodminer.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive_1
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive_1
      Dead:
        Base: alive_1
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:SpawnEntitiesBehavior
        offset: 0
        spawn:
          LavalandMobBloodMinerBuffed:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/_VanGuard/Effects/Magic/Clockwork/fellowship_armory.ogg
  - type: MovementSpeedModifier
    baseWalkSpeed: 4.4
    baseSprintSpeed: 4.4
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    angle: 0
    attackRate: 2
    animation: WeaponArcPunch
    damage:
      types:
        Slash: 10
    range: 1

- type: entity
  parent: LavalandMobBloodMinerBase
  id: LavalandMobBloodMinerBuffed
  name: enraged blood miner
  description: The blood miner's second wind. It is faster, angrier, and no less armed.
  components:
  - type: Sprite
    sprite: _VanGuard/Mobs/Aliens/Lavaland/bloodminer.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive_2
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive_2
      Dead:
        Base: alive_2
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:SpawnEntitiesBehavior
        offset: 0.5
        spawn:
          LavalandCleavingSaw:
            min: 1
            max: 1
          WeaponProtoKineticAccelerator:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/_VanGuard/Effects/far_noise.ogg
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    angle: 0
    attackRate: 0.9
    animation: WeaponArcPunch
    damage:
      types:
        Slash: 16
    range: 2
  - type: MovementSpeedModifier
    baseWalkSpeed: 4.2
    baseSprintSpeed: 4.2
  - type: LavalandBloodMiner
    teleportInterval: 6

- type: entity
  parent: BaseAction
  id: ActionBloodMinerShoot
  name: kinetic shot
  description: Fire a kinetic bolt at a target.
  components:
  - type: Action
    useDelay: 5
    priority: 2
    itemIconStyle: BigAction
    sound:
      path: /Audio/Weapons/Guns/Gunshots/kinetic_accel.ogg
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: chronobolt
  - type: TargetAction
    checkCanAccess: false
    range: 0
  - type: WorldTargetAction
    event: !type:ProjectileSpellEvent
      prototype: BulletKineticPistol

- type: entity
  parent: MarkerBase
  id: LavalandSpawnMobBloodMiner
  name: blood miner spawner
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: green
    - sprite: _VanGuard/Mobs/Aliens/Lavaland/bloodminer.rsi
      state: alive_1
  - type: RandomSpawner
    prototypes:
    - LavalandMobBloodMiner
    deleteSpawnerAfterSpawn: true
