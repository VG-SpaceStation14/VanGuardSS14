# Sponsor-only professional loadout groups.
#
# These groups contain only sponsor-exclusive items. They are attached to the
# corresponding jobs instead of being injected into the personal Inventory
# group, so a sponsor sees a professional item exactly where the job expects it.
# Existing job groups keep all of their regular options; sponsor items are only
# appended to them or placed in these sponsor-only groups.

