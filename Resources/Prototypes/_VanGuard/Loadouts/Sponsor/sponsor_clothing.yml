# Sponsor-exclusive clothing.
#
# Professional items are listed directly in the loadout groups of their job
# (for example CaptainNeck, SalvageSpecialistNeck or the department medal
# groups). Universal items are listed in the personal "Inventory" group.
# Nothing is injected automatically: every loadout below has an explicit group.
# A loadout only becomes selectable when the player's sponsor tier is at least
# the tier declared below, so tiers are naturally cumulative.
#
# Role gates use the existing GroupLoadoutEffect / loadoutEffectGroup mechanism.
# No new items, sprites or gameplay mechanics are introduced here.

# A dedicated time gate for the security pilot, whose role timer is not covered
# by any of the existing department/role effect groups.
- type: loadoutEffectGroup
  id: PilotVeteran
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobPilot
      time: 20h

# Simple department gates for the sponsor medals, matching the existing
# CargoVeteran gate. The regular "Senior*" groups require several roles at once
# and are intentionally reserved for the master-tier department clothing.
- type: loadoutEffectGroup
  id: MedicalVeteran
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:DepartmentTimeRequirement
      department: Medical
      time: 15h

- type: loadoutEffectGroup
  id: ScienceVeteran
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:DepartmentTimeRequirement
      department: Science
      time: 15h

- type: loadoutEffectGroup
  id: EngineeringVeteran
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:DepartmentTimeRequirement
      department: Engineering
      time: 15h

- type: loadoutEffectGroup
  id: SecurityVeteran
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:DepartmentTimeRequirement
      department: Security
      time: 15h

