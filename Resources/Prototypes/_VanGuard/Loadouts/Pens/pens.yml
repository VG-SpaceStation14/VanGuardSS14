# Pen selection for the PDA pen slot.
# Pens are grouped by ink colour with the GroupBy field, so the loadout UI shows the colours
# as nested subgroups. The pen names state their ink colour explicitly.

- type: loadoutGroup
  id: PdaPen
  name: loadout-group-pda-pen
  minLimit: 0
  maxLimit: 1
  loadouts:
  - PenAtmos
  - PenCargo
  - PenChaplain
  - PenChemist
  - PenEngineering
  - PenGreen
  - PenHearts
  - PenHydroponics
  - PenJanitor
  - PenMedical1
  - PenCamouflage
  - PenPink
  - PenPurple
  - PenRainbow
  - PenMedia
  - PenYellow
  - PenViolet
  - PenStarry
  - PenScienceOverpriced
  - PenScience
  - PenBrigmedic
  - PenSecurityBlack
  - PenSecurityRed
  - PenSecurityFountain
  - BlackFountainPen

- type: loadout
  id: PenAtmos
  groupBy: pen-blue
  storage:
    id:
    - PenAtmos

