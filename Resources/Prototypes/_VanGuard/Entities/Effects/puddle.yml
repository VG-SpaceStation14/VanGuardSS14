- type: entity
  name: Footstep
  id: Footstep
  save: false
  description: Trace of liquid
  components:
  - type: Clickable
  - type: Transform
    noRot: false
  - type: Sprite
    drawdepth: FloorObjects
  - type: Solution
    id: step
    solution:
      maxVol: 1
  - type: Footprint
    printType: Foot
  - type: Puddle
    solution: step
  - type: Appearance
  - type: DnaSubstanceTrace

- type: entity
  name: drag mark
  parent: Footstep
  id: DragMark
  components:
  - type: Footprint
    printType: DragMark
  - type: Solution
    id: step
    solution:
      maxVol: 5
