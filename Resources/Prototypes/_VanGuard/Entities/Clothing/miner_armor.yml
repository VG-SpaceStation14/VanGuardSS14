- type: entity
  abstract: true
  parent: [ ClothingOuterBase, AllowSuitStorageClothingGasTanks ]
  id: ClothingOuterArmorMinerBase
  components:
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot {}
  - type: ExplosionResistance
    damageCoefficient: 0.9

- type: entity
  parent: ClothingOuterArmorMinerBase
  id: ClothingOuterArmorMiner
  components:
  - type: Sprite
    sprite: _VanGuard/Clothing/OuterClothing/Armor/mining.rsi
  - type: Clothing
    sprite: _VanGuard/Clothing/OuterClothing/Armor/mining.rsi
    slots: [ outerClothing ]
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.95
        Heat: 0.8
        Caustic: 0.7
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetMiner
    slot: head
    action: ActionToggleSuitPiece
    verbText: toggle-clothing-verb-helmet
  - type: Tag
    tags: [ MinerArmor ]

