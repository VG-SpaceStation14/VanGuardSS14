# VG-Tweak: language system.
# The universal language, understood by every entity.
- type: language
  id: Universal
  icon:
    sprite: /Textures/_VanGuard/Interface/Chat/language.rsi
    state: what
  style: !type:LinguisticStyle
    replacement:
    - "*incomprehensible*"

# Syndicate operatives use a series of codewords to convey complex information.
- type: language
  id: CodeSpeak
  uiColor: Crimson
  parent: BaseVocalLanguage
  icon:
    sprite: /Textures/_VanGuard/Interface/Chat/language.rsi
    state: codespeak
  style: !type:LinguisticStyle
    obfuscateSyllables: true
    color: Crimson
    replacement:
    - "Белый русский"
    - "Представитель станции"
