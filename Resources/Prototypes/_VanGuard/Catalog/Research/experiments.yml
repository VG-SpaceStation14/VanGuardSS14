# Field experiments issued by experiment scanners. Each experiment has a condition
# that must be fulfilled by scanning entities, and rewards research points.

- type: researchExperiment
  id: ExperimentAmeUnsafeInject
  group: Experiments
  name: experiment-order-ame-name
  description: experiment-order-ame-desc
  rewardPoints: 10000
  condition: !type:AmeOverloadScanCondition
    safeInjectionPerCore: 2
    requirePowered: true

- type: researchExperiment
  id: ExperimentSpeciesSafeReagent
  group: Experiments
  name: experiment-order-species-safe-name
  description: experiment-order-species-safe-desc
  rewardPoints: 10000
  condition: !type:SpeciesReagentScanCondition
    solutionName: bloodstream
    excludedSpecies:
    - IPC
    reagents:
    - Ipecac
    - Cryptobiolin
    - Mannitol
    - Psicodine
    - Charcoal

