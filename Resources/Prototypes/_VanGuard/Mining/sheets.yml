# Bluespace crystal (refined from bluespace ore on the ore processor)

- type: stack
  parent: BaseMediumStack
  id: BluespaceCrystal
  name: stack-bluespace-crystal
  icon: { sprite: /Textures/_VanGuard/Objects/Materials/bluespace_crystal.rsi, state: bluespace_crystal }
  spawn: SheetBluespaceCrystal1

- type: entity
  parent: SheetOtherBase
  id: SheetBluespaceCrystal
  name: bluespace crystal
  suffix: Full
  components:
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      BluespaceCrystal: 100
  - type: Stack
    stackType: BluespaceCrystal
    baseLayer: base
    layerStates:
    - bluespace_crystal
    - bluespace_crystal_2
    - bluespace_crystal_3
  - type: Sprite
    sprite: _VanGuard/Objects/Materials/bluespace_crystal.rsi
    state: bluespace_crystal_3
    layers:
    - state: bluespace_crystal_3
      map: ["base"]
  - type: Item
    sprite: _VanGuard/Objects/Materials/bluespace_crystal.rsi
    heldPrefix: bluespace_crystal
  - type: StackPrice
    price: 200 # VG-Tweak: bluespace crystals are expensive.

- type: entity
  parent: SheetBluespaceCrystal
  id: SheetBluespaceCrystal10
  name: bluespace crystal
  suffix: 10
  components:
  - type: Sprite
    state: bluespace_crystal
  - type: Stack
    count: 10

- type: entity
  parent: SheetBluespaceCrystal
  id: SheetBluespaceCrystal1
  name: bluespace crystal
  suffix: Single
  components:
  - type: Sprite
    state: bluespace_crystal
  - type: Stack
    count: 1
