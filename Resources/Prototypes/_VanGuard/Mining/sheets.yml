  - type: PhysicalComposition
    materialComposition:
      Zinc: 100
  - type: Stack
    stackType: Zinc
    baseLayer: base
    layerStates:
    - zinc
    - zinc_2
    - zinc_3
  - type: Sprite
    sprite: _VanGuard/Objects/Materials/zinc_sheet.rsi
    state: zinc_3
    layers:
    - state: zinc_3
      map: ["base"]
  - type: Item
    sprite: _VanGuard/Objects/Materials/zinc_sheet.rsi
    heldPrefix: zinc
  - type: Solution
    solution:
      reagents:
      - ReagentId: Zinc
        Quantity: 3.3
      - ReagentId: Carbon
        Quantity: 0.9

- type: entity
  parent: SheetZinc
  id: SheetZinc10
  name: zinc
  suffix: 10
  components:
  - type: Sprite
    state: zinc
  - type: Stack
    count: 10

- type: entity
  parent: SheetZinc
  id: SheetZinc1
  name: zinc
  suffix: Single
  components:
  - type: Sprite
    state: zinc
  - type: Stack
    count: 1

