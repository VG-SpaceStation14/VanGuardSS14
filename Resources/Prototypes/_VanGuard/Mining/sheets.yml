# Refined copper, zinc and lead: ingots/sheets produced by the ore processor.
# All of them carry the Material marker so they can be fed into lathes for crafting.

# Stacks

- type: stack
  parent: BaseMediumStack
  id: Copper
  name: stack-copper
  icon: { sprite: /Textures/Objects/Materials/ingots.rsi, state: copper }
  spawn: IngotCopper1

- type: stack
  parent: BaseSheetStack
  id: Zinc
  name: stack-zinc
  icon: { sprite: /Textures/_VanGuard/Objects/Materials/zinc_sheet.rsi, state: zinc }
  spawn: SheetZinc1

- type: stack
  parent: BaseSheetStack
  id: Lead
  name: stack-lead
  icon: { sprite: /Textures/_VanGuard/Objects/Materials/lead_sheet.rsi, state: lead }
  spawn: SheetLead1

# Copper ingot (ingots.rsi already has copper states)

- type: entity
  parent: IngotBase
  id: IngotCopper
  name: copper
  suffix: Full
  components:
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      Copper: 100
  - type: Stack
    stackType: Copper
    baseLayer: base
    layerStates:
    - copper
    - copper_2
    - copper_3
  - type: Sprite
    state: copper_3
    layers:
    - state: copper_3
      map: ["base"]
  - type: Item
    heldPrefix: copper
  - type: Solution
    solution:
      reagents:
      - ReagentId: Copper
        Quantity: 8.8
      - ReagentId: Carbon
        Quantity: 0.9

- type: entity
  parent: IngotCopper
  id: IngotCopper1
  name: copper
  suffix: Single
  components:
  - type: Sprite
    state: copper
  - type: Stack
    count: 1

# Zinc sheet

- type: entity
