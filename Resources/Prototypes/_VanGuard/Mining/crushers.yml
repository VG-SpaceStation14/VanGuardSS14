  - type: Item
    size: Ginormous
    sprite: _VanGuard/Objects/Weapons/Melee/Crushers/crusher_hammer-inhands.rsi
  - type: Wieldable
  - type: Clothing
    sprite: _VanGuard/Objects/Weapons/Melee/Crushers/crusher_hammer.rsi
    quickEquip: false
    slots:
