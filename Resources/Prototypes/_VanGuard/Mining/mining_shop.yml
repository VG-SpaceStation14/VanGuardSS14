# One-use delivery bag used for express delivery: handed to the buyer, using it
# dumps the ordered goods onto the floor and deletes the bag.
- type: entity
  parent: BaseItem
  id: MiningShopDeliveryBag
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Specific/Cargo/mail_bag.rsi
    state: icon
  - type: Item
    sprite: Objects/Specific/Cargo/mail_bag.rsi
    size: Normal
  - type: Storage
    maxItemSize: Ginormous
    grid:
    - 0,0,8,6
    quickInsert: true
    areaInsert: true
  - type: MiningShopDeliveryBag
