# Copper, zinc and lead ore generation: asteroids, magnet-attracted asteroids
# and random-ore rocks. Vein overlays use the stone-ore.rsi states
# (rock_copper / rock_zinc / rock_lead / rock_bluespace), hidden until revealed by the mining scanner.

# Ore yield definitions (used by OreVein components)

- type: ore
  id: OreCopper
  oreEntity: CopperOre1
  minOreYield: 1
  maxOreYield: 3

- type: ore
  id: OreZinc
  oreEntity: ZincOre1
  minOreYield: 1
  maxOreYield: 3

- type: ore
  id: OreLead
  oreEntity: LeadOre1
  minOreYield: 1
  maxOreYield: 3

# Asteroid vein rocks

- type: entity
  parent: AsteroidRock
  id: AsteroidRockCopper
  description: An ore vein rich with copper.
  suffix: Copper
  components:
  - type: OreVein
    oreChance: 1.0
    currentOre: OreCopper
  - type: Sprite
    layers:
    - state: rock_copper
      sprite: Structures/Walls/stone-ore.rsi
      visible: false
      map: [ "enum.MiningScannerVisualLayers.Overlay" ]

- type: entity
  parent: AsteroidRock
  id: AsteroidRockZinc
  description: An ore vein rich with zinc.
  suffix: Zinc
  components:
  - type: OreVein
    oreChance: 1.0
    currentOre: OreZinc
  - type: Sprite
    layers:
    - state: rock_zinc
      sprite: Structures/Walls/stone-ore.rsi
      visible: false
      map: [ "enum.MiningScannerVisualLayers.Overlay" ]

- type: entity
  parent: AsteroidRock
  id: AsteroidRockLead
  description: An ore vein rich with lead.
  suffix: Lead
  components:
  - type: OreVein
    oreChance: 1.0
    currentOre: OreLead
  - type: Sprite
    layers:
    - state: rock_lead
      sprite: Structures/Walls/stone-ore.rsi
      visible: false
      map: [ "enum.MiningScannerVisualLayers.Overlay" ]

# Magnet asteroid generation

- type: oreDunGen
  id: OreCopper
  replacement: AsteroidRock
  entity: AsteroidRockCopper
  count: 4
  minGroupSize: 5
  maxGroupSize: 7

- type: oreDunGen
  id: OreZinc
  replacement: AsteroidRock
  entity: AsteroidRockZinc
  count: 4
  minGroupSize: 5
  maxGroupSize: 7

- type: oreDunGen
  id: OreLead
  replacement: AsteroidRock
  entity: AsteroidRockLead
  count: 4
  minGroupSize: 5
  maxGroupSize: 7

# Bluespace ore (NOT on the planetoid - vgroid.yml deliberately has no bluespace veins)

- type: ore
  id: OreBluespace
  oreEntity: BluespaceOre1
  minOreYield: 1
  maxOreYield: 3

- type: entity
  parent: AsteroidRock
  id: AsteroidRockBluespace
  description: An ore vein rich with bluespace crystals.
  suffix: Bluespace
  components:
  - type: OreVein
    oreChance: 1.0
    currentOre: OreBluespace
  - type: Sprite
    layers:
    - state: rock_bluespace
      sprite: Structures/Walls/stone-ore.rsi
      visible: false
      map: [ "enum.MiningScannerVisualLayers.Overlay" ]

- type: oreDunGen
  id: OreBluespace
  replacement: AsteroidRock
  entity: AsteroidRockBluespace
  count: 3
  minGroupSize: 3
  maxGroupSize: 5

# Planet biome markers (low-value ores, on par with iron/coal)

- type: biomeMarkerLayer
  id: OreCopper
  entityMask:
    AsteroidRock: AsteroidRockCopper
  maxCount: 30
  minGroupSize: 10
  maxGroupSize: 15
  radius: 4

- type: biomeMarkerLayer
  id: OreZinc
  entityMask:
    AsteroidRock: AsteroidRockZinc
  maxCount: 30
  minGroupSize: 10
  maxGroupSize: 15
  radius: 4

- type: biomeMarkerLayer
  id: OreLead
  entityMask:
    AsteroidRock: AsteroidRockLead
  maxCount: 30
  minGroupSize: 10
  maxGroupSize: 15
  radius: 4

