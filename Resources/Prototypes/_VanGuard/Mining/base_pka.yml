- type: entity
  id: WeaponProtoKineticPistolBase
  abstract: true
  parent: BaseItem
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Basic/kinetic_accelerator.rsi
  - type: Item
    sprite: Objects/Weapons/Guns/Basic/kinetic_accelerator.rsi
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
  - type: Gun
    fireRate: 0.5
    selectedMode: SemiAuto
    angleDecay: 14
    angleIncrease: 1
    minAngle: 2
    maxAngle: 8
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/kinetic_accel.ogg
    projectileSpeed: 25
  - type: AmmoCounter
  - type: CustomSpriteAmmoCounter
    loadedAmmoSprite: Interface/ItemStatus/PKA/not_spent.png
    spentAmmoSprite: Interface/ItemStatus/PKA/spent.png
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.AmmoVisuals.HasAmmo:
        empty-icon:
          True: { visible: False }
          False: { visible: True }
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 0.75
    rechargeSound:
      path: /Audio/Weapons/Guns/MagIn/kinetic_reload.ogg
  - type: BasicEntityAmmoProvider
    proto: BulletKinetic
    capacity: 1
    count: 1
  - type: Clothing
    sprite: Objects/Weapons/Guns/Basic/kinetic_accelerator.rsi
    quickEquip: false
    slots:
    - suitStorage
    - Belt
  - type: UseDelay
    delay: 1