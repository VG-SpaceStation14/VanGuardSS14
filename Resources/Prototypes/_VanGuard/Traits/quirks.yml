# Character quirks for the VanGuard build.
# A quirk is a small, situational trait: positives cost trait points, negatives refund them.
# Every quirk below has a real gameplay effect that is applied when the character spawns.

- type: traitCategory
  id: VGQuirks
  name: vg-trait-category-quirks
  maxTraitPoints: 5

# Positive quirks

- type: trait
  id: VGQuirkFleetFooted
  name: vg-trait-fleet-footed-name
  description: vg-trait-fleet-footed-desc
  category: VGQuirks
  cost: 3
  conflicts:
  - VGQuirkHeavyGait
  specials:
  - !type:AddComponentSpecial
    removeExisting: false
    components:
    - type: QuirkMovementSpeed
      walkModifier: 1.02
      sprintModifier: 1.07


- type: trait
  id: VGQuirkSturdyNerves
  name: vg-trait-sturdy-nerves-name
  description: vg-trait-sturdy-nerves-desc
  category: VGQuirks
  cost: 2
  conflicts:
  - VGQuirkWeakNerves
  specials:
  - !type:AddComponentSpecial
    removeExisting: false
    components:
    - type: StaminaResistance
      damageCoefficient: 0.85
      worn: false


- type: trait
  id: VGQuirkColdHardened
  name: vg-trait-cold-hardened-name
  description: vg-trait-cold-hardened-desc
  category: VGQuirks
  cost: 2
  conflicts:
  - VGQuirkFragile
  - VGQuirkFrostbite
  - VGQuirkRadHardened
  - VGQuirkRadSensitive
  speciesBlacklist:
  - Diona
  specials:
  - !type:AddComponentSpecial
    removeExisting: false
    components:
    - type: QuirkDamageTypeResistance
      modifiers:
        Cold: 0.75


- type: trait
  id: VGQuirkClearHead
  name: vg-trait-clear-head-name
  description: vg-trait-clear-head-desc
  category: VGQuirks
  cost: 2
  conflicts:
  - LightweightDrunk
  speciesBlacklist:
  - Diona
  - SlimePerson
  specials:
  - !type:AddComponentSpecial
    removeExisting: false
    components:
    - type: LightweightDrunk
      boozeStrengthMultiplier: 0.5


- type: trait
  id: VGQuirkQuickClot
  name: vg-trait-quick-clot-name
  description: vg-trait-quick-clot-desc
  category: VGQuirks
  cost: 1
  conflicts:
  - VGQuirkThinBlood
  specials:
  - !type:AddComponentSpecial
    removeExisting: false
    components:
    - type: QuirkBleedRate
      bleedMultiplier: 0.75


- type: trait
  id: VGQuirkRadHardened
  name: vg-trait-rad-hardened-name
  description: vg-trait-rad-hardened-desc
  category: VGQuirks
  cost: 1
  conflicts:
  - VGQuirkColdHardened
  - VGQuirkFragile
  - VGQuirkFrostbite
  - VGQuirkRadSensitive
  speciesWhitelist:
  - Diona
  specials:
  - !type:AddComponentSpecial
    removeExisting: false
    components:
    - type: QuirkDamageTypeResistance
      modifiers:
        Radiation: 0.8


