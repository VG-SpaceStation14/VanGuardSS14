# VG-Tweak Start: research tree layout (position) and prerequisites added for the custom console.
# PowerGeneration is the common parent; the other branches spread from it.
# Power generators are split: base (Pacman) -> plasma (SuperPacman) -> uranium (JrPacman)
# right before the battery progression.
# CompactTechnologies (RCD) was added after AdvancedToolsTechnology.

