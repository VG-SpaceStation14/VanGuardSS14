- type: job
  id: Clown
  name: job-name-clown
  description: job-description-clown
  playTimeTracker: JobClown
  # VG-Tweak Start: economy salary rebalance.
  salary: 220
  # VG-Tweak End
  requirements:
  - !type:OverallPlaytimeRequirement
      time: 3600 #1 hrs # Corvax-RoleTime
  startingGear: ClownGear
  icon: "JobIconClown"
  supervisors: job-supervisors-hop
  guides: [ Service ] # TODO: should have a more specific guidebook page instead of using the department itself
  access:
  - Theatre
  - Maintenance
  special:
  - !type:AddComponentSpecial
    components:
    - type: PermanentStatusEffects
      statusEffects:
      - StatusEffectClumsyClown
    - type: SleepEmitSound
      snore: /Audio/Voice/Misc/silly_snore.ogg
      interval: 10
  - !type:AddImplantSpecial
    implants: [ SadTromboneImplant ]

- type: startingGear
  id: ClownGear
  equipment:
    mask: ClothingMaskClown
    pocket1: BikeHorn
    pocket2: ClownRecorder
    # VG-Tweak Start: the PDA is handed out by the ClownID loadout group so RP variations can replace it.
    # id: ClownPDA
    # VG-Tweak End
    ears: ClothingHeadsetService
  inhand:
  - FoolboxFilled
  storage:
    back:
    - RubberStampClown
    - CrayonRainbow

- type: chameleonOutfit
  id: ClownChameleonOutfit
  job: Clown
  equipment:
    head: ClothingHeadHatXmasCrown
    eyes: ClothingEyesGlassesCheapSunglasses
    neck: ClothingHeadHatFlowerWreath
    outerClothing: ClothingOuterClownPriest
    gloves: ClothingHandsGlovesColorYellowBudget
