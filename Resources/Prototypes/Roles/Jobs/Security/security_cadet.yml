- type: job
  id: SecurityCadet
  name: job-name-cadet
  description: job-description-cadet
  playTimeTracker: JobSecurityCadet
  # VG-Tweak Start: economy salary rebalance.
  salary: 220
  # VG-Tweak End
  requirements:
    - !type:OverallPlaytimeRequirement
      time: 10h # Corvax-RoleTime
    - !type:DepartmentTimeRequirement
      department: Security
      time: 20h # Corvax-RoleTime 5
      inverted: true # stop playing intern if you're good at security!
    - !type:TraitsRequirement #Corvax-TraitsRequirement
      inverted: true
      traits:
      - Muted
  startingGear: SecurityCadetGear
  icon: "JobIconSecurityCadet"
  supervisors: job-supervisors-security
  guides: [ Security ] # TODO: should have a more specific guidebook page instead of using the department itself
  access:
  - Security
  - Brig
  - Maintenance
  # VG-Tweak Start: a cadet patrols outside and handles prisoners only together with an officer,
  # so this access is extended (lowpop) only, like in the old build.
  extendedAccess:
  - External
  - Cryogenics
  - GenpopEnter
  - GenpopLeave
  # VG-Tweak End
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]

- type: startingGear
  id: SecurityCadetGear
  equipment:
    shoes: ClothingShoesBootsJackSec # Corvax-Resprite-MRP
    outerClothing: ClothingOuterArmorBasic
    # VG-Tweak Start: the PDA is handed out by the SecurityCadetID loadout group so pen choices can replace the pen.
    # id: SecurityCadetPDA
    # VG-Tweak End
    ears: ClothingHeadsetSecurity
    belt: ClothingBeltSecurityFilled
    pocket1: WeaponPistolMk58
    pocket2: BookSpaceLaw # Corvax-HyperLink
  storage:
    back:
    - Flash
    - MagazinePistol

- type: chameleonOutfit
  id: SecurityCadetChameleonOutfit
  job: SecurityCadet
  hasMindShield: true
  equipment:
    head: ClothingHeadHelmetBasic
    eyes: ClothingEyesHudSecurity
    mask: ClothingMaskGasSecurity
    neck: ClothingNeckScarfStripedRed
    belt: ClothingBeltSecurity
    gloves: ClothingHandsGlovesColorBlack
