- type: entity
  id: Incorporeal
  save: false
  abstract: true
  description: Mobs without physical bodies
  components:
  - type: Sprite
    noRot: true
    overrideContainerOcclusion: true # Always show up regardless of where they're contained.
    drawdepth: Ghosts
  - type: FTLSmashImmune
  - type: CargoSellBlacklist
  - type: MovementSpeedModifier
    baseSprintSpeed: 12
    baseWalkSpeed: 8
  - type: MovementIgnoreGravity
  - type: Physics
    bodyType: KinematicController
    bodyStatus: InAir
  - type: CanMoveInAir
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 15
        layer:
        - GhostImpassable

# shared parent between aghosts, replay spectators and normal observers
- type: entity
  parent:
  - Incorporeal
  - BaseMob
  id: MobObserverBase
  abstract: true
  name: observer
  description: Boo!
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Mobs/Ghosts/ghost_human.rsi
    color: "#fff8"
    # VG-Ghost Start
    layers:
    - map: [ "enum.HumanoidVisualLayers.Special" ]
      shader: unshaded
    - map: [ "enum.HumanoidVisualLayers.Chest" ]
      shader: unshaded
    - map: [ "enum.HumanoidVisualLayers.Head" ]
      shader: unshaded
    - map: [ "enum.HumanoidVisualLayers.Snout" ]
      shader: unshaded
    - map: [ "enum.HumanoidVisualLayers.Eyes" ]
      shader: unshaded
    - map: [ "enum.HumanoidVisualLayers.RArm" ]
      shader: unshaded
    - map: [ "enum.HumanoidVisualLayers.LArm" ]
      shader: unshaded
    - map: [ "enum.HumanoidVisualLayers.RLeg" ]
      shader: unshaded
    - map: [ "enum.HumanoidVisualLayers.LLeg" ]
      shader: unshaded
    - map: [ "enum.HumanoidVisualLayers.UndergarmentBottom" ]
      shader: unshaded
    - map: [ "enum.HumanoidVisualLayers.UndergarmentTop" ]
      shader: unshaded
    - map: [ "enum.HumanoidVisualLayers.LFoot" ]
      shader: unshaded
    - map: [ "enum.HumanoidVisualLayers.RFoot" ]
      shader: unshaded
    - map: ["enum.HumanoidVisualLayers.LHand"]
      shader: unshaded
    - map: ["enum.HumanoidVisualLayers.RHand"]
      shader: unshaded
    - map: ["enum.HumanoidVisualLayers.Overlay"]
      shader: unshaded
    - map: [ "enum.HumanoidVisualLayers.SnoutCover" ]
      shader: unshaded
    - map: [ "enum.HumanoidVisualLayers.FacialHair" ]
      shader: unshaded
    - map: [ "enum.HumanoidVisualLayers.Hair" ]
      shader: unshaded
    - map: [ "enum.HumanoidVisualLayers.HeadSide" ]
      shader: unshaded
    - map: [ "enum.HumanoidVisualLayers.HeadTop" ]
      shader: unshaded
    - map: [ "enum.HumanoidVisualLayers.Tail" ]
      shader: unshaded
    - map: [ "enum.HumanoidVisualLayers.TailOverlay" ]
      shader: unshaded
  - type: Body
  - type: VisualBody
  - type: ContainerContainer
  - type: Appearance
  - type: HideableHumanoidLayers
  - type: InitialBody
    organs:
      Torso: OrganHumanTorso
      Head: OrganHumanHead
      ArmLeft: OrganHumanArmLeft
      ArmRight: OrganHumanArmRight
      HandRight: OrganHumanHandRight
      HandLeft: OrganHumanHandLeft
      LegLeft: OrganHumanLegLeft
      LegRight: OrganHumanLegRight
      FootLeft: OrganHumanFootLeft
      FootRight: OrganHumanFootRight
    relationships:
      Torso: [Head, ArmLeft, ArmRight, LegLeft, LegRight]
  - type: HumanoidProfile
    species: GhostSpecies
    # VG-Ghost End
  - type: ContentEye
    maxZoom: 1.44,1.44
  - type: Eye
    drawFov: false
  - type: Input
    context: "ghost"
  - type: Examiner
    skipChecks: true
  - type: Ghost
    # VG-Tweak Start
    ableClothingMarkings:
    - ClothingJumpsuitPhysician
    - ClothingJumpsuitResearcher
    - ClothingJumpsuitWeb
    - ClothingJumpsuitSecurity
    - ClothingJumpsuitBartender
    - ClothingJumpsuitBartenderPurple
    - ClothingJumpsuitChef
    - ClothingJumpsuitChemistry
    - ClothingJumpsuitDetective
    - ClothingJumpsuitHawai
    - ClothingJumpsuitHos
    - ClothingJumpsuitJanitor
    - ClothingJumpsuitKimono
    - ClothingJumpsuitMime
    - ClothingJumpsuitMonatic
    - ClothingJumpsuitParamedic
    - ClothingJumpsuitPirate
    # VG-Tweak End
  - type: GhostSpriteState
    damageMap:
      Blunt: 3
      Slash: 3
      Piercing: 3
      Heat: 1
      Cold: 1
      Shock: 1
      Radiation: 1
      Cellular: 1
      Poison: 1
      Asphyxiation: 1
    prefix: "ghost_"
  - type: GhostHearing
  - type: ShowElectrocutionHUD
  - type: IntrinsicRadioReceiver
  - type: ActiveRadio
    receiveAllChannels: true
    globalReceive: true
  - type: NightVision
    netsync: false
    enabled: false
    prioritized: false
    relayOverlay: false # In case default values change
    lightingColor: '#FFFFFF20'
    overlayColor: '#FFFFFF00'
    noiseAmount: 0 # In case default values change
    noiseMultiplier: 0 # In case default values change

# proto for player ghosts specifically
- type: entity
  parent: MobObserverBase
  id: MobObserver
  components:
  - type: Spectral
  - type: Tag
    tags:
    - AllowGhostShownByEvent
    - AllowPortalTraversal
    - PreventPortalCollision

- type: entity
  parent: BaseMentalAction
  id: ActionGhostBoo
  name: Boo!
  description: Scare your crew members because of boredom!
  components:
  - type: Action
    checkCanInteract: false
    startDelay: true
    useDelay: 120
  - type: Sprite
    layers:
    - texture: Interface/Actions/scream.png
  - type: InstantAction
    event: !type:BooActionEvent

- type: entity
  parent: BaseMentalAction
  id: ActionToggleLighting
  name: Toggle Lighting
  description: Toggle light rendering to better observe dark areas.
  components:
  - type: Action
    clientExclusive: true
  - type: Sprite
    layers:
    - texture: Interface/VerbIcons/light.svg.192dpi.png
  - type: InstantAction
    event: !type:ToggleLightingActionEvent

- type: entity
  parent: BaseMentalAction
  id: ActionToggleFov
  name: Toggle FoV
  description: Toggles field-of-view in order to see what players see.
  components:
  - type: Action
    clientExclusive: true
  - type: Sprite
    layers:
    - texture: Interface/VerbIcons/vv.svg.192dpi.png
  - type: InstantAction
    event: !type:ToggleFoVActionEvent

- type: entity
  parent: BaseMentalAction
  id: ActionToggleGhosts
  name: Toggle Ghosts
  description: Toggle the visibility of other ghosts.
  components:
  - type: Action
    clientExclusive: true
  - type: Sprite
    sprite: Mobs/Ghosts/ghost_human.rsi
    layers:
    - state: icon
  - type: InstantAction
    event: !type:ToggleGhostsActionEvent

- type: entity
  parent: BaseMentalAction
  id: ActionToggleGhostHearing
  name: Toggle Ghost Hearing
  description: Toggle between hearing all messages and hearing only radio & nearby messages.
  components:
  - type: Action
  - type: Sprite
    sprite: Clothing/Ears/Headsets/base.rsi
    layers:
    - state: icon
      map: ["enum.ActionVisuals.Icon"]
    - texture: Interface/Actions/ghostHearingToggled.png
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:ToggleGhostHearingActionEvent
