- type: entity
  # VG-Tweak Start: localized name/description (ent-OreBag).
  id: OreBag
  parent: BaseStorageItem
  # VG-Tweak End
  components:
  - type: MagnetPickup
    # VG-Tweak Start: ore bags can be worn in pockets.
    slotFlags: POCKET
    # VG-Tweak End
  - type: Sprite
    sprite: Objects/Specific/Mining/ore_bag.rsi
    state: icon
  - type: Clothing
    sprite: Objects/Specific/Mining/ore_bag.rsi
    quickEquip: false
    slots:
    - belt
  - type: Item
    # VG-Tweak Start: small enough to fit in pockets/backpacks.
    size: Small
    # VG-Tweak End
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,9,3
    quickInsert: true
    areaInsert: true
    whitelist:
      tags:
        - ArtifactFragment
        - Ore
  - type: Dumpable
  # VG-Tweak Start: marked so ore processors can auto-insert its contents.
  - type: Tag
    tags:
    - AutoInsertOreBag
  # VG-Tweak End

- type: entity
  parent: OreBag
  id: BorgOreBag
  # VG-Tweak Start: localized name/description (ent-BorgOreBag).
  # VG-Tweak End
  components:
    - type: MagnetPickup
      slotFlags: null
      requireActiveHand: true
    - type: Storage
      grid:
      - 0,0,9,5
