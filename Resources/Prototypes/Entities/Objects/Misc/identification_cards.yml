- type: entity
  parent: Clothing
  id: IDCardStandard
  name: identification card
  description: A card necessary to access various areas aboard the station.
  abstract: true
  components:
  - type: Sprite
    sprite: _VanGuard/Objects/Misc/id_cards.rsi # VG-Tweak - New IDs
  - type: Clothing
    slots:
    - idcard
    sprite: _VanGuard/Objects/Misc/id_cards.rsi # VG-Tweak - New IDs
  - type: Item
    size: Small
    heldPrefix: default
    storedRotation: -90
  - type: Access
  - type: IdCard
  - type: StationRecordKeyStorage
  - type: Tag
    tags:
    - DoorBumpOpener
    - WhitelistChameleon
    - WhitelistChameleonIdCard
  - type: StealTarget
    stealGroup: IDCard
  # VanGuard-Sticker-Start
  - type: ItemSlots
    slots:
      sticker:
        name: sticker-slot
        startingItem: null
        whitelist:
          tags:
          - Sticker
  - type: Appearance
  # VanGuard-Sticker-End
  # VG-Tweak Start
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_VanGuard/Items/handling/card_pickup.ogg
      params:
        volume: -5
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_VanGuard/Items/handling/card_drop.ogg
      params:
        volume: -5
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_VanGuard/Items/handling/card_drop.ogg
      params:
        volume: -5
  # VG-Tweak End

#IDs with layers

- type: entity
  parent: IDCardStandard
  id: PassengerIDCard
  name: passenger ID card
  components:
  - type: Sprite
    layers:
    - state: default
    - sprite: &icon-rsi Interface/Misc/job_icons.rsi
      offset: &icon-offset -0.17475, 0.02025 # VG-Tweak
      state: Passenger
    # VanGuard-Sticker-Start
    - state: sticker
      map: ["Sticker"]
      visible: false
      sprite: _VanGuard/Objects/Misc/stickers.rsi
    # VanGuard-Sticker-End
  - type: PresetIdCard
    job: Passenger

